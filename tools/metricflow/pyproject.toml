# MetricFlow's `mf` CLI (ADR 0023, 0024), in an environment of its own. It is built on dbt-core
# 1.x, whose Python package is also named `dbt`, so it cannot share the project's environment
# with dbt v2. It only reads target/semantic_manifest.json, which dbt v2 writes, and queries the
# warehouse through dbt-duckdb. dbt v2's own `dbt sl` needs a dbt platform account.
[project]
name = "clickstream-metricflow"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core==1.12.7",
    "dbt-duckdb==1.11.1",
    "dbt-metricflow==0.16.0",
    "duckdb==2.0.0",
]

[tool.uv]
package = false
