name: clickstream-lakehouse

services:
  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900" # S3 API
      - "127.0.0.1:3903:3903" # admin API
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Source system: the shop's order database. Debezium reads it from week 5, so it is the only
  # instance with logical decoding (see ADR 0011).
  postgres-shop:
    image: postgres:18.7
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_USER: ${SHOP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SHOP_POSTGRES_PASSWORD}
      POSTGRES_DB: shop
    volumes:
      # Postgres 18 images keep PGDATA in a versioned subdirectory of /var/lib/postgresql.
      - postgres-shop-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHOP_POSTGRES_USER} -d shop"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Platform metadata: Lakekeeper's catalog now, Airflow's metadata database from week 3.
  # Default configuration, no replication.
  postgres-platform:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PLATFORM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PLATFORM_POSTGRES_PASSWORD}
      POSTGRES_DB: lakekeeper
    volumes:
      - postgres-platform-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLATFORM_POSTGRES_USER} -d lakekeeper"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Iceberg REST catalog (ADR 0002). Its state lives in the `lakekeeper` database on
  # postgres-platform; `lakekeeper-migrate` brings the schema up before the server starts.
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.15.1
    restart: "no"
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${PLATFORM_POSTGRES_USER}:${PLATFORM_POSTGRES_PASSWORD}@postgres-platform:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${PLATFORM_POSTGRES_USER}:${PLATFORM_POSTGRES_PASSWORD}@postgres-platform:5432/lakekeeper
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
    depends_on:
      postgres-platform:
        condition: service_healthy

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.15.1
    restart: unless-stopped
    command: ["serve"]
    environment:
      <<: *lakekeeper-env
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      garage:
        condition: service_healthy
    ports:
      - "127.0.0.1:8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # --- Streaming ingest (ADR 0005), only with `--profile stream` (make stream-up) -------------
  # One Kafka broker in KRaft mode, the Schema Registry for the Avro events (ADR 0006), the sink
  # that writes them to bronze, and Redpanda Console to look at topics and schemas. Containers use
  # kafka:19092; the host (the generator, `make stream-day`) uses 127.0.0.1:9092.
  kafka:
    image: apache/kafka:4.4.0
    profiles: [stream]
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # The image's default is under /tmp, which a recreated container loses; the topic must
      # survive, because bronze's branch records offsets into it.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # One broker: every internal topic has one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Every topic is created on purpose (kafka-init), not by the first client that names it.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  # The event topic, created once with its partitions and kept forever: the stream is the replay
  # log of the shop's clicks, as the landing files are.
  kafka-init:
    image: apache/kafka:4.4.0
    profiles: [stream]
    restart: "no"
    command:
      - sh
      - -c
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
        --topic clickstream.events --partitions 3 --replication-factor 1 --config retention.ms=-1
    depends_on:
      kafka:
        condition: service_healthy

  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.1
    profiles: [stream]
    restart: unless-stopped
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:19092
      # The default, stated: a new schema must read data written with the previous one (ADR 0006).
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      # The Confluent images have no curl: a plain HTTP request over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /subjects HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      kafka:
        condition: service_healthy

  # Appends the topic to bronze's branch `stream` with PyIceberg (ingest/stream.py). The
  # Kafka offsets are committed with the rows, in the Iceberg snapshot.
  stream-sink:
    build:
      context: ..
      dockerfile: infra/stream-sink/Dockerfile
    image: clickstream-lakehouse/stream-sink:latest
    profiles: [stream]
    restart: unless-stopped
    env_file: ../.env
    environment:
      LAKEKEEPER_URL: http://lakekeeper:8181
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PYTHONUNBUFFERED: "1"
    volumes:
      - ..:/opt/project:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy

  console:
    image: docker.redpanda.com/redpandadata/console:v3.15.0
    profiles: [stream]
    restart: unless-stopped
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
    volumes:
      - ./console/config.yaml:/etc/console/config.yaml:ro
    ports:
      - "127.0.0.1:8090:8080" # 8080 and 8088 are taken by the dbt docs and Airflow
    depends_on:
      schema-registry:
        condition: service_healthy

  # --- Airflow (ADR 0017), only with `--profile airflow` (make airflow-up) --------------------
  # Its metadata database is `airflow` on postgres-platform (ADR 0011), created here because
  # the instance's init scripts run only on an empty volume.
  airflow-db-init:
    image: postgres:18.7
    profiles: [airflow]
    restart: "no"
    environment:
      PGHOST: postgres-platform
      PGUSER: ${PLATFORM_POSTGRES_USER}
      PGPASSWORD: ${PLATFORM_POSTGRES_PASSWORD}
      PGDATABASE: lakekeeper
    command:
      - sh
      - -c
      - psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'airflow'" | grep -q 1
        || psql -c "CREATE DATABASE airflow"
    depends_on:
      postgres-platform:
        condition: service_healthy

  airflow-init:
    &airflow
    build:
      context: ..
      dockerfile: infra/airflow/Dockerfile
    image: clickstream-lakehouse/airflow:3.4.0
    profiles: [airflow]
    restart: "no"
    command: ["db", "migrate"]
    # The project's .env (S3 key, Postgres users), then what differs inside the network.
    env_file: ../.env
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PLATFORM_POSTGRES_USER}:${PLATFORM_POSTGRES_PASSWORD}@postgres-platform:5432/airflow
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev-only-airflow-jwt-secret}
      # Local only: no login, everyone is an admin.
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      PROJECT_DIR: /opt/project
      PROJECT_PYTHON: /opt/project-venv/bin/python
      DBT_EXECUTABLE: /opt/project-venv/bin/dbt
      # dbt v2 without usage statistics, as the Makefile runs it (ADR 0024).
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      DBT_ENGINE_NO_WARN_SEMANTIC_MANIFEST_VALIDATION: "1"
      DBT_DUCKDB_PATH: /opt/project/data/warehouse.duckdb
      LAKEKEEPER_URL: http://lakekeeper:8181
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SHOP_POSTGRES_HOST: postgres-shop
      SHOP_POSTGRES_PORT: "5432"
    volumes:
      - ..:/opt/project
      - airflow-logs:/opt/airflow/logs
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully

  airflow-api-server:
    <<: *airflow
    restart: unless-stopped
    command: ["api-server"]
    ports:
      - "127.0.0.1:8088:8080" # 8080 is taken by `make dbt-docs`
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on: &airflow-depends
      airflow-init:
        condition: service_completed_successfully
      lakekeeper:
        condition: service_healthy
      postgres-shop:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow
    restart: unless-stopped
    command: ["scheduler"]
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on: *airflow-depends

  airflow-dag-processor:
    <<: *airflow
    restart: unless-stopped
    command: ["dag-processor"]
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "DagProcessorJob", "--local"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on: *airflow-depends

  # Cosmos's watcher sensors defer to it while dbt builds.
  airflow-triggerer:
    <<: *airflow
    restart: unless-stopped
    command: ["triggerer"]
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "TriggererJob", "--local"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    depends_on: *airflow-depends

volumes:
  airflow-logs:
  kafka-data:
  garage-meta:
  garage-data:
  postgres-shop-data:
  postgres-platform-data:
