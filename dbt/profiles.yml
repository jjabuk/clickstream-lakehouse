# DuckDB is the engine and holds staging, intermediate and marts in one file (ADR 0013).
# It reads bronze from the Iceberg catalog (ADR 0003) and the shop's users straight from
# Postgres (ADR 0014). Credentials come from the environment (`.env`, exported by make).
clickstream:
  target: dev
  outputs:
    dev: &dev
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'data/warehouse.duckdb') }}"
      threads: 4
      extensions: [httpfs, iceberg, postgres]
      settings:
        # DuckDB takes the OS time zone otherwise, which moves late-evening UTC rows to the next
        # day in any CAST(... AS DATE). Every date in this project is a UTC date.
        TimeZone: UTC
      secrets:
        - type: s3
          key_id: "{{ env_var('S3_ACCESS_KEY_ID') }}"
          secret: "{{ env_var('S3_SECRET_ACCESS_KEY') }}"
          endpoint: "{{ env_var('S3_ENDPOINT') | replace('http://', '') }}"
          region: "{{ env_var('S3_REGION', 'garage') }}"
          url_style: path
          use_ssl: "false"
      attach:
        - &iceberg
          path: lakehouse
          alias: lk
          type: iceberg
          read_only: true
          options:
            uri: "{{ env_var('LAKEKEEPER_URL', 'http://localhost:8181') }}/catalog"
            authorization_type: none
            # Garage has no STS, so DuckDB signs with its own key (ADR 0003).
            access_delegation_mode: none
        - &shop
          path: "host={{ env_var('SHOP_POSTGRES_HOST', 'localhost') }} port={{ env_var('SHOP_POSTGRES_PORT', '5432') }} dbname=shop user={{ env_var('SHOP_POSTGRES_USER') }} password={{ env_var('SHOP_POSTGRES_PASSWORD') }}"
          alias: shop
          type: postgres
          read_only: true

    # Slim CI on pull requests (ADR 0015): builds only the modified models into its own file and
    # defers every other ref to the production warehouse that the last build of `main` uploaded.
    # The production manifest names that warehouse's database `warehouse` (the file's stem), so it
    # is attached under that alias, read-only. Everything else is the dev target.
    ci:
      <<: *dev
      path: data/ci/pr.duckdb
      attach:
        - *iceberg
        - *shop
        - path: "{{ env_var('DBT_DEFER_DUCKDB_PATH', 'data/ci/state/warehouse.duckdb') }}"
          alias: warehouse
          read_only: true

    # Used by sqlfluff (make lint-sql, pre-commit, CI) and dbt_project_evaluator (make
    # dbt-evaluate). Compiling a model renders names and the evaluator reads only the project
    # graph, so neither touches data: no stack, no credentials, no attached databases.
    lint:
      type: duckdb
      path: ":memory:"
      threads: 1

# Read by the elementary CLI (`make elementary-report`): the warehouse file, and the schema where
# the elementary package keeps test results and run artifacts.
elementary:
  target: default
  outputs:
    default:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'data/warehouse.duckdb') }}"
      schema: main_elementary
      threads: 1
      settings:
        TimeZone: UTC
