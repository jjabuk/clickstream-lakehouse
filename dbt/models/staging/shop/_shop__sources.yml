version: 2

sources:
  - name: shop
    description: The shop's Postgres database, read directly until CDC lands in week 5.
    database: shop
    schema: public
    tables:
      - name: users
        description: One row per registered user; country and plan change over time.
      - name: products
        description: One row per product.
      - name: categories
        description: One row per product category.
