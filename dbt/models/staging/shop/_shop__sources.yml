version: 2

sources:
  - name: shop
    description: >
      The shop's Postgres database, read directly for its reference data and users. Orders do not
      come from here but from the change log (`shop_cdc`), so their history is kept.
    database: shop
    schema: public
    tables:
      - name: users
        description: One row per registered user; country and plan change over time.
      - name: products
        description: One row per product.
      - name: categories
        description: One row per product category.

