version: 2

models:
  - name: stg_shop__users
    description: "Grain: one row per registered user (`user_id`), current state."
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: plan
        data_tests:
          - accepted_values:
              arguments:
                values: [free, premium]
      - name: updated_at
        description: Simulated time of the latest change to country or plan.
        data_tests: [not_null]

  - name: stg_shop__products
    description: "Grain: one row per product (`product_id`)."
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__categories')
                field: category_id

  - name: stg_shop__categories
    description: "Grain: one row per product category (`category_id`)."
    columns:
      - name: category_id
        data_tests: [unique, not_null]
