version: 2

models:
  - name: stg_shop_cdc__order_changes
    description: >
      Grain: one change to an order (`order_id`, `lsn`), deduplicated from the at-least-once
      change log. Inserts, status updates, and the snapshot rows of orders that existed before
      CDC started.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, change_type, lsn]
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: change_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [insert, update, delete, snapshot]
      - name: status
        description: The status after the change; null for a delete.
        data_tests:
          - accepted_values:
              arguments:
                values: [created, paid, shipped, delivered, returned, cancelled]
      - name: changed_at
        description: Simulated time of the change (the row's `updated_at`).
        data_tests: [not_null]
      - name: log_position
        description: Position in the change log, which follows Postgres's commit order.
        data_tests: [unique, not_null]

  - name: stg_shop_cdc__order_items
    description: "Grain: one order line (`order_id`, `line_no`), its latest image."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, line_no]
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__products')
                field: product_id
