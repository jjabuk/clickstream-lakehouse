version: 2

# Metrics built from the simple metrics of the semantic models in _marts.yml (ADR 0023). Every
# rate is a ratio of two sums, so it stays correct at any grain and filter. Evidence restates the
# metrics it shows under the same names, and `make metrics-check` (in CI: `make ci-metrics`)
# compares the two day by day.
metrics:
  - name: bounce_rate
    label: Bounce rate
    description: Share of sessions with a single page view.
    type: ratio
    numerator: bounced_sessions
    denominator: sessions

  - name: product_rate
    label: Reached a product
    description: Share of sessions that viewed a product (closed funnel, step 1).
    type: ratio
    numerator: product_sessions
    denominator: sessions

  - name: cart_rate
    label: Added to cart
    description: Share of sessions that reached the cart after a product view (step 2).
    type: ratio
    numerator: cart_sessions
    denominator: sessions

  - name: checkout_rate
    label: Reached checkout
    description: Share of sessions that reached checkout through the funnel (step 3).
    type: ratio
    numerator: checkout_sessions
    denominator: sessions

  - name: cart_to_checkout_rate
    label: Cart to checkout
    description: Of the sessions that reached the cart, the share that went on to checkout.
    type: ratio
    numerator: checkout_sessions
    denominator: cart_sessions

  - name: pages_per_session
    label: Pages per session
    type: ratio
    numerator: session_page_views
    denominator: sessions

  - name: bot_share
    label: Bot share of events
    description: What bot filtering removes before the other marts.
    type: ratio
    numerator: bot_events
    denominator: events

  - name: visitor_product_to_checkout_7d
    label: Product view to checkout within 7 days (visitor)
    description: >
      Of the visitors who viewed a product on a day, the share that reached a checkout page within
      7 days, in the same session or a later one, which session rates cannot see. Filter on
      `visitor_day__is_window_complete`: the last 7 days of data can still convert.
    type: ratio
    numerator: converted_viewer_days
    denominator: product_viewer_days

  - name: return_rate
    label: Return rate
    description: Of the delivered orders, the share returned since. Recent orders can still be returned.
    type: ratio
    numerator: returned_orders
    denominator: delivered_orders

  - name: cancellation_rate
    label: Cancellation rate
    type: ratio
    numerator: cancelled_orders
    denominator: orders

  - name: average_order_value
    label: Average order value
    description: Net revenue per paid order.
    type: ratio
    numerator: net_revenue
    denominator: paid_orders

  - name: orders_per_session
    label: Orders per session
    description: >
      Orders over human sessions in the same period, across two facts: the shop's orders from
      CDC and the clickstream's sessions, joined on time only.
    type: ratio
    numerator: orders
    denominator: sessions

  - name: identified_session_share
    label: Identified sessions
    description: >
      Share of sessions with a known user, logged in or stitched from the cookie (ADR 0022).
    type: ratio
    numerator: identified_sessions
    denominator: sessions
