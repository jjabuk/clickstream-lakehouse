version: 2

models:
  - name: fct_page_views
    description: >
      Grain: one page view of a human visitor (`event_id`). Bots and add_to_cart events are
      excluded. Incremental by merge on `event_id`; rows inside the lookback window are
      recomputed on every run because late events can change session membership (ADR 0004).
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [session_id, page_number_in_session]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "received_at >= occurred_at"
    semantic_model:
      enabled: true
    agg_time_dimension: occurred_at
    columns:
      - name: event_id
        data_type: varchar
        description: The event's id from the tracker; one row per page view after deduplication.
        entity:
          type: primary
          name: page_view
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: session_id
        data_type: varchar
        entity:
          type: foreign
          name: session
        description: Hash of the visitor's cookie and the session's first page view time.
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_sessions')
                field: session_id
      - name: session_started_at
        data_type: timestamp with time zone
        description: First page view time of the session this view belongs to.
        data_tests: [not_null]
      - name: page_number_in_session
        data_type: bigint
        description: Position of the view within its session, starting at 1.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: cookie_id
        data_type: varchar
        entity:
          type: foreign
          name: visitor
        description: Browser cookie; never null here, because bots are excluded.
        data_tests: [not_null]
      - name: user_id
        data_type: bigint
        description: Registered user while logged in, otherwise null.
      - name: user_key
        data_type: varchar
        entity:
          type: foreign
          name: user
        description: The user's dimension row valid at `occurred_at`, or the unknown member.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_key
      - name: occurred_at
        data_type: timestamp with time zone
        description: When the page view happened, UTC; the client's time, capped at the server's.
        granularity: hour
        dimension:
          type: time
        data_tests: [not_null]
      - name: date_key
        data_type: integer
        description: UTC date of `occurred_at` as yyyymmdd.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: received_at
        data_type: timestamp with time zone
        description: When the first delivery of the event reached the platform, UTC.
        data_tests:
          - not_null
          # The SLA (ADR 0026): a day behind the simulated clock fails; a partial day warns.
          - fresh_as_of_simulated_now:
              arguments:
                warn_after_hours: 6
                error_after_hours: 18
      - name: page_type
        data_type: varchar
        description: home, category, product, cart or checkout.
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: [home, category, product, cart, checkout]
      - name: page_key
        data_type: varchar
        description: The page in dim_page.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_page')
                field: page_key
      - name: page_url
        data_type: varchar
        description: Path of the viewed page.
      - name: product_id
        data_type: bigint
        description: The product of a product page, otherwise null.
      - name: device
        data_type: varchar
        description: mobile or desktop, from the user agent.
        data_tests:
          - accepted_values:
              arguments:
                values: [mobile, desktop]
      - name: country
        data_type: varchar
        description: Country of the visitor from the tracker.
      - name: utm_campaign
        data_type: varchar
        description: Campaign of the session; exists only from the day the tracking was extended.
    metrics:
      - name: page_views
        label: Page views
        description: Human page views.
        type: simple
        agg: count
        expr: 1

  - name: fct_sessions
    description: >
      Grain: one session (`session_id`), a run of one visitor's page views with no gap longer
      than `session_timeout_minutes`. A plain table rebuilt from fct_page_views on every run.
      Device and country come from the entry page view; user and campaign from the first page
      view that has one, so a mid-session login attributes the whole session to the user.
    config:
      contract:
        enforced: true
    # Version 2 renamed utm_campaign to campaign: a breaking change, so a new version (ADR 0025).
    # Each version is its own table (fct_sessions_v1, fct_sessions_v2); dbt v2 points
    # fct_sessions at the latest.
    latest_version: 2
    versions:
      - v: 2
      - v: 1
        deprecation_date: 2027-01-31
        columns:
          - include: all
            # v1 is frozen: the identity columns came after it (ADR 0022).
            exclude: [campaign, identified_user_id, identity_source, person_id]
          - name: utm_campaign
            data_type: varchar
            description: Campaign of the first page view that has one, or null.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "session_ended_at >= session_started_at"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_bounce = (page_views = 1)"
      # Every page view belongs to exactly one session, so the two facts must agree on volume.
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          arguments:
            expression: sum(page_views)
            compare_model: ref('fct_page_views')
            compare_expression: count(*)
    semantic_model:
      enabled: true
    agg_time_dimension: session_started_at
    columns:
      - name: session_id
        data_type: varchar
        description: Hash of the visitor's cookie and the session's first page view time.
        entity:
          type: primary
          name: session
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: cookie_id
        data_type: varchar
        description: Browser cookie of the visitor.
        entity:
          type: foreign
          name: visitor
        data_tests: [not_null]
      - name: user_id
        data_type: bigint
        description: Registered user of the first identified page view, or null if nobody logged in.
      - name: user_key
        data_type: varchar
        description: The user's dimension version at that page view, or the unknown member.
        entity:
          type: foreign
          name: user
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_key
      - name: session_started_at
        data_type: timestamp with time zone
        description: First page view of the session, UTC.
        granularity: hour
        dimension:
          type: time
        data_tests: [not_null]
      - name: session_ended_at
        data_type: timestamp with time zone
        description: Last page view of the session, UTC.
        data_tests: [not_null]
      - name: date_key
        data_type: integer
        description: UTC date of the session start as yyyymmdd.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: duration_seconds
        data_type: double
        description: >
          Seconds between first and last view. Capped by the session context window the
          incremental fact assumes, so a longer session means that assumption is broken.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: "{{ var('session_context_hours') * 3600 }}"
      - name: page_views
        data_type: bigint
        description: Page views in the session.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: is_bounce
        data_type: boolean
        dimension:
          type: categorical
        description: True for a session with a single page view.
      - name: entry_page_type
        data_type: varchar
        description: Page type of the first page view.
        dimension:
          type: categorical
      - name: exit_page_type
        data_type: varchar
        description: Page type of the last page view.
      - name: product_views
        data_type: bigint
        description: Product page views in the session.
      - name: device
        data_type: varchar
        description: Device of the entry page view.
        dimension:
          type: categorical
      - name: country
        data_type: varchar
        description: Country of the entry page view.
        dimension:
          type: categorical
      - name: campaign
        data_type: varchar
        description: Campaign of the first page view that has one, or null (utm_campaign in v1).
        dimension:
          type: categorical
      - name: last_received_at
        data_type: timestamp with time zone
        description: Latest arrival among the session's page views.
        data_tests:
          # The SLA (ADR 0026): a day behind the simulated clock fails; a partial day warns.
          - fresh_as_of_simulated_now:
              arguments:
                warn_after_hours: 6
                error_after_hours: 18
      - name: reached_product
        data_type: boolean
        description: The session viewed a product (first step of the closed funnel).
        data_tests: [not_null]
      - name: reached_cart
        data_type: boolean
        description: The session viewed the cart after a product view.
        data_tests: [not_null]
      - name: reached_checkout
        data_type: boolean
        description: The session viewed the checkout after a cart view that followed a product view.
        data_tests: [not_null]
      - name: identified_user_id
        data_type: bigint
        description: >
          The user who logged in during the session, or else the cookie's stitched user
          (int_identity__cookie_to_user, ADR 0022), or null.
      - name: identity_source
        data_type: varchar
        description: >
          How the session's person is known: `login` (somebody logged in during it), `stitched`
          (nobody did, but the cookie is one user's device), `shared_device` (nobody did, and
          several users log in on the cookie) or `anonymous`.
        dimension:
          type: categorical
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [login, stitched, shared_device, anonymous]
      - name: person_id
        data_type: varchar
        description: >
          The visitor to count: `user:<identified_user_id>`, or `cookie:<cookie_id>` when nobody
          is known. One person for all devices of a user.
        data_tests: [not_null]
    metrics:
      - name: sessions
        label: Sessions
        description: Human sessions (bots never reach the marts).
        type: simple
        agg: count
        expr: session_id
      - name: visitors
        label: Visitors
        description: Distinct cookies. Not additive across days or devices.
        type: simple
        agg: count_distinct
        expr: cookie_id
      - name: people
        label: People
        description: >
          Distinct persons: stitched users across all their devices, and the cookies nobody is
          known on (ADR 0022). Not additive across days.
        type: simple
        agg: count_distinct
        expr: person_id
      - name: identified_sessions
        label: Identified sessions
        description: Sessions with a known user, by login or by stitching.
        type: simple
        agg: count
        expr: identified_user_id
      - name: bounced_sessions
        label: Bounced sessions
        type: simple
        agg: sum_boolean
        expr: is_bounce
      - name: product_sessions
        label: Sessions with a product view
        type: simple
        agg: sum_boolean
        expr: reached_product
      - name: cart_sessions
        label: Sessions that reached the cart
        type: simple
        agg: sum_boolean
        expr: reached_cart
      - name: checkout_sessions
        label: Sessions that reached checkout
        type: simple
        agg: sum_boolean
        expr: reached_checkout
      - name: session_page_views
        label: Page views in sessions
        type: simple
        agg: sum
        expr: page_views
      - name: avg_session_duration_seconds
        label: Average session duration (s)
        type: simple
        agg: average
        expr: duration_seconds

  - name: dim_user
    description: >
      Grain: one version of a registered user (`user_key`), valid from `effective_from` to
      `effective_to`, plus one "unknown" member for anonymous visits. Type 2 history of country
      and plan from the snapshot of the shop's users.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, effective_from]
      # Exactly one current version per user (the unknown member has no user_id).
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id]
          config:
            where: "is_current and user_id is not null"
    semantic_model:
      enabled: true
    columns:
      - name: user_key
        data_type: varchar
        description: Surrogate key of this version (the snapshot's scd id); facts point here.
        entity:
          type: primary
          name: user
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: user_id
        data_type: bigint
        description: The shop's user id; null for the unknown member.
      - name: country
        data_type: varchar
        description: Country of the user in this version.
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: plan
        data_type: varchar
        description: free or premium in this version; unknown for the unknown member.
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: [free, premium, unknown]
      - name: effective_from
        data_type: timestamp with time zone
        description: Start of the version; the first version reaches back to 1900.
        data_tests: [not_null]
      - name: effective_to
        data_type: timestamp with time zone
        description: End of the version, exclusive; 9999-12-31 for the current one.
        data_tests: [not_null]
      - name: is_current
        data_type: boolean
        description: True for the version valid now.

  - name: dim_page
    description: >
      Grain: one page URL of the shop (`page_url`): the home, cart and checkout pages, every
      category page and every product page.
    config:
      contract:
        enforced: true
    columns:
      - name: page_key
        data_type: varchar
        description: Surrogate key of the page URL.
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: page_url
        data_type: varchar
        description: Path of the page.
        data_tests: [unique, not_null]
      - name: page_type
        data_type: varchar
        description: home, category, product, cart or checkout.
        data_tests:
          - accepted_values:
              arguments:
                values: [home, category, product, cart, checkout]
      - name: category_id
        data_type: integer
        description: Category of a category or product page, otherwise null.
      - name: category_slug
        data_type: varchar
        description: URL slug of that category.
      - name: product_id
        data_type: integer
        description: Product of a product page, otherwise null.

  - name: dim_date
    description: "Grain: one calendar day in UTC (`date_key`), from the start of the simulated world."
    config:
      contract:
        enforced: true
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_key
        data_type: integer
        description: The day as yyyymmdd.
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: date_day
        data_type: date
        description: The calendar day; also the semantic layer's daily time spine.
        granularity: day
        data_tests: [unique, not_null]
      - name: calendar_year
        data_type: bigint
        description: Calendar year.
      - name: calendar_month
        data_type: bigint
        description: Month of the year, 1 to 12.
      - name: day_of_month
        data_type: bigint
        description: Day of the month, 1 to 31.
      - name: iso_year
        data_type: bigint
        description: ISO 8601 week-numbering year.
      - name: iso_week
        data_type: bigint
        description: ISO 8601 week number.
      - name: day_of_week
        data_type: bigint
        description: ISO day of week, Monday = 1.
      - name: is_weekend
        data_type: boolean
        description: Saturday or Sunday.
      - name: week_start_date
        data_type: date
        description: Monday of the ISO week.

  - name: fct_funnel_daily
    description: >
      Grain: one day × device × campaign (`funnel_key`). Session counts at each ordered funnel
      step (product view → cart → checkout) and bounced sessions. Only additive counts; rates are
      ratios of sums, computed by the reader.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_key, device, utm_campaign]
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          arguments:
            expression: sum(sessions)
            compare_model: ref('fct_sessions')
            compare_expression: count(*)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "sessions >= product_sessions and product_sessions >= cart_sessions and cart_sessions >= checkout_sessions"
    columns:
      - name: funnel_key
        data_type: varchar
        description: Surrogate key of day, device and campaign.
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: date_key
        data_type: integer
        description: Day of the session start as yyyymmdd.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: device
        data_type: varchar
        description: Device of the sessions.
        data_tests: [not_null]
      - name: utm_campaign
        data_type: varchar
        description: Campaign, or `(none)` for sessions without one.
        data_tests: [not_null]
      - name: sessions
        data_type: bigint
        description: Human sessions.
      - name: bounced_sessions
        data_type: bigint
        description: Sessions with a single page view; bounce rate = bounced_sessions / sessions.
      - name: product_sessions
        data_type: bigint
        description: Sessions that viewed a product (first funnel step).
      - name: cart_sessions
        data_type: bigint
        description: Sessions that reached the cart after a product view.
      - name: checkout_sessions
        data_type: bigint
        description: Sessions that reached the checkout after a cart view that followed a product view.

  - name: fct_retention_weekly
    description: >
      Grain: one cohort week × activity week (`retention_key`). A visitor is a person
      (`fct_sessions.person_id`: the stitched user on all their devices, or the cookie when
      nobody is known, ADR 0022) and belongs to the ISO week of their first human session.
      `cohort_visitors` repeats the cohort's size on every row, so it must not be summed across
      activity weeks.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "active_visitors <= cohort_visitors and activity_week >= cohort_week"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "weeks_since_first_visit > 0 or active_visitors = cohort_visitors"
    columns:
      - name: retention_key
        data_type: varchar
        description: Surrogate key of cohort week and activity week.
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: cohort_week
        data_type: date
        description: Monday of the visitor's first week.
        data_tests: [not_null]
      - name: activity_week
        data_type: date
        description: Monday of the week the visitors were active in.
        data_tests: [not_null]
      - name: weeks_since_first_visit
        data_type: integer
        description: Whole weeks between the cohort week and the activity week.
      - name: cohort_visitors
        data_type: bigint
        description: Visitors in the cohort; repeated on every row of the cohort.
      - name: active_visitors
        data_type: bigint
        description: Cohort visitors with a session in the activity week.

  - name: fct_traffic_daily
    description: >
      Grain: one day × traffic type (`traffic_key`, `is_bot`). Deduplicated events of humans and
      bots, to show what bot filtering removes from the other marts.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_key, is_bot]
    semantic_model:
      enabled: true
    agg_time_dimension: date_day
    columns:
      - name: traffic_key
        data_type: varchar
        description: Surrogate key of day and traffic type.
        entity:
          type: primary
          name: traffic_day
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: date_key
        data_type: integer
        description: Day of the events as yyyymmdd.
        data_tests: [not_null]
      - name: date_day
        data_type: date
        description: UTC date of the event, the same day as `date_key`.
        granularity: day
        dimension:
          type: time
        data_tests:
          - not_null
          # The SLA (ADR 0026): a day behind the simulated clock fails; a partial day warns.
          - fresh_as_of_simulated_now:
              arguments:
                warn_after_hours: 6
                error_after_hours: 18
                period: day
      - name: is_bot
        data_type: boolean
        description: True for bot traffic (no cookie or a bot user agent).
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: events
        data_type: bigint
        description: Deduplicated events of all types.
      - name: page_view_events
        data_type: bigint
        description: Deduplicated page views.
      - name: add_to_cart_events
        data_type: bigint
        description: Deduplicated add-to-cart events.
    metrics:
      - name: events
        label: Events
        description: Deduplicated events of humans and bots.
        type: simple
        agg: sum
        expr: events
      - name: bot_events
        label: Bot events
        type: simple
        agg: sum
        expr: events
        filter: "{{ Dimension('traffic_day__is_bot') }}"

  - name: fct_visitor_conversion_daily
    description: >
      Grain: one visitor (cookie) × day with a product view (`visitor_day_key`). Whether the
      visitor reached a checkout page within 7 days after their first product view of that day,
      in the same session or a later one. Rows whose 7-day window is still open
      (`is_window_complete` false) can still convert and belong out of rates.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cookie_id, product_day]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "converted_at is null or converted_at > product_viewed_at"
    semantic_model:
      enabled: true
    agg_time_dimension: product_viewed_at
    columns:
      - name: visitor_day_key
        data_type: varchar
        description: Surrogate key of cookie and day.
        entity:
          type: primary
          name: visitor_day
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: cookie_id
        data_type: varchar
        description: Browser cookie of the visitor.
        entity:
          type: foreign
          name: visitor
        data_tests: [not_null]
      - name: date_key
        data_type: integer
        description: The product view day as yyyymmdd.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: product_day
        data_type: date
        description: UTC day of the product views.
        data_tests: [not_null]
      - name: product_viewed_at
        data_type: timestamp with time zone
        description: The visitor's first product view of the day; the 7-day window starts here.
        granularity: hour
        dimension:
          type: time
        data_tests: [not_null]
      - name: device
        data_type: varchar
        description: Device of that first product view.
        dimension:
          type: categorical
      - name: converted_at
        data_type: timestamp with time zone
        description: First checkout page view inside the window, or null.
      - name: is_converted_7d
        data_type: boolean
        description: A checkout followed within 7 days.
        data_tests: [not_null]
      - name: is_window_complete
        data_type: boolean
        description: >
          The 7 days after the product view are all in the data, so the row cannot change any
          more. False for the last week of data.
        dimension:
          type: categorical
        data_tests: [not_null]
    metrics:
      - name: product_viewer_days
        label: Visitors with a product view (visitor-days)
        description: One per visitor and day with a product view.
        type: simple
        agg: count
        expr: 1
      - name: converted_viewer_days
        label: Of those, reached checkout within 7 days
        type: simple
        agg: sum_boolean
        expr: is_converted_7d

  - name: fct_product_views_daily
    description: >
      Grain: one product × day (`product_day_key`), only for days with activity. Human views of
      the product's page and adds to cart; bots are excluded.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_key, product_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "visitors <= sessions and sessions <= page_views"
    columns:
      - name: product_day_key
        data_type: varchar
        description: Surrogate key of day and product.
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: date_key
        data_type: integer
        description: UTC day of the events as yyyymmdd.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: date_day
        data_type: date
        description: UTC date of the events, the same day as `date_key`.
        data_tests: [not_null]
      - name: product_id
        data_type: bigint
        description: The product viewed or added to cart.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__products')
                field: product_id
      - name: category_id
        data_type: integer
        description: The product's category.
        data_tests: [not_null]
      - name: page_views
        data_type: bigint
        description: Human views of the product's page that day.
        data_tests: [not_null]
      - name: sessions
        data_type: bigint
        description: Sessions with at least one view of the product's page that day.
        data_tests: [not_null]
      - name: visitors
        data_type: bigint
        description: Distinct cookies that viewed the product's page that day.
        data_tests: [not_null]
      - name: add_to_carts
        data_type: bigint
        description: Human adds of the product to a cart that day.
        data_tests: [not_null]

  - name: fct_orders
    description: >
      Grain: one order (`order_id`), an accumulating snapshot: the current status and a timestamp
      per milestone, from the shop's change log (ADR 0007). Orders that existed before CDC
      started have `is_history_complete` false and only the milestones from then on; their
      status, total and creation time are complete, and so are counts and revenue.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "paid_at is null or paid_at >= created_at"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "shipped_at is null or paid_at is null or shipped_at >= paid_at"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_total_consistent"
    semantic_model:
      enabled: true
    agg_time_dimension: created_at
    columns:
      - name: order_id
        data_type: bigint
        description: The shop's order id.
        entity:
          type: primary
          name: order
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: user_key
        data_type: varchar
        entity:
          type: foreign
          name: user
        description: The user's dimension row valid at `created_at`, or the unknown member (guests).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_key
      - name: user_id
        data_type: bigint
        description: Registered user who placed the order; null for a guest checkout.
      - name: cookie_id
        data_type: varchar
        description: Browser cookie of the checkout, which ties the order to the clickstream.
        entity:
          type: foreign
          name: visitor
        data_tests: [not_null]
      - name: date_key
        data_type: integer
        description: UTC date of `created_at` as yyyymmdd.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: created_at
        data_type: timestamp with time zone
        description: When the order was placed (simulated time).
        granularity: hour
        dimension:
          type: time
        data_tests: [not_null]
      - name: status
        data_type: varchar
        description: Current status.
        dimension:
          type: categorical
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [created, paid, shipped, delivered, returned, cancelled]
      - name: status_changed_at
        data_type: timestamp with time zone
        description: When the order entered its current status.
        data_tests: [not_null]
      - name: paid_at
        data_type: timestamp with time zone
        description: Milestone; null if not reached, or reached before CDC started.
      - name: shipped_at
        data_type: timestamp with time zone
        description: Milestone, as `paid_at`.
      - name: delivered_at
        data_type: timestamp with time zone
        description: Milestone, as `paid_at`.
      - name: returned_at
        data_type: timestamp with time zone
        description: Milestone, as `paid_at`.
      - name: cancelled_at
        data_type: timestamp with time zone
        description: Milestone, as `paid_at`.
      - name: is_paid
        data_type: boolean
        description: Paid, whatever happened next (from the current status).
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: is_delivered
        data_type: boolean
        description: Reached the customer (delivered, or delivered and returned).
        data_tests: [not_null]
      - name: is_returned
        data_type: boolean
        description: Returned after delivery.
        data_tests: [not_null]
      - name: is_cancelled
        data_type: boolean
        description: Cancelled before shipping.
        data_tests: [not_null]
      - name: is_closed
        data_type: boolean
        description: In a final status (delivered, returned or cancelled); a delivered order can still be returned.
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: is_history_complete
        data_type: boolean
        description: The log has the order from its insert, so every milestone is known.
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: status_changes
        data_type: bigint
        description: Status updates in the change log.
        data_tests: [not_null]
      - name: line_count
        data_type: bigint
        description: Order lines.
        data_tests: [not_null]
      - name: units
        data_type: bigint
        description: Units over all lines.
        data_tests: [not_null]
      - name: order_total
        data_type: decimal(18,2)
        description: Order total in the shop's currency.
        data_tests: [not_null]
      - name: net_revenue
        data_type: decimal(18,2)
        description: The total of a paid order that was neither returned nor cancelled, else 0.
        data_tests: [not_null]
      - name: is_total_consistent
        data_type: boolean
        description: The lines add up to the order total.
      - name: hours_paid_to_shipped
        data_type: double
        description: Hours from payment to shipping; null unless both milestones are known.
      - name: hours_created_to_delivered
        data_type: double
        description: Hours from the order to its delivery; null unless both milestones are known.
    metrics:
      - name: orders
        label: Orders
        description: Orders placed.
        type: simple
        agg: count
        expr: order_id
      - name: paid_orders
        label: Paid orders
        description: Orders that were paid, including those returned since.
        type: simple
        agg: sum_boolean
        expr: is_paid
      - name: delivered_orders
        label: Delivered orders
        type: simple
        agg: sum_boolean
        expr: is_delivered
      - name: returned_orders
        label: Returned orders
        type: simple
        agg: sum_boolean
        expr: is_returned
      - name: cancelled_orders
        label: Cancelled orders
        type: simple
        agg: sum_boolean
        expr: is_cancelled
      - name: net_revenue
        label: Net revenue
        description: Paid orders, less returns and cancellations, by order date.
        type: simple
        agg: sum
        expr: net_revenue

  - name: fct_order_status_changes
    description: >
      Grain: one status an order entered (`order_status_change_key`): its creation and every
      transition, from the change log (ADR 0007). Dated by the change, not by the order.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, changed_at, to_status]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "hours_in_previous_status is null or hours_in_previous_status >= 0"
    columns:
      - name: order_status_change_key
        data_type: varchar
        description: Surrogate key of the order and the change's position in the WAL.
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: order_id
        data_type: bigint
        description: The order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: date_key
        data_type: integer
        description: UTC date of `changed_at` as yyyymmdd.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: from_status
        data_type: varchar
        description: The status before; null for the order's creation.
      - name: to_status
        data_type: varchar
        description: The status entered.
        data_tests: [not_null]
      - name: changed_at
        data_type: timestamp with time zone
        description: When the order entered `to_status` (simulated time).
        data_tests:
          - not_null
          # The SLA (ADR 0026) for the orders: the change log is behind the simulated clock.
          - fresh_as_of_simulated_now:
              arguments:
                warn_after_hours: 6
                error_after_hours: 18
      - name: hours_in_previous_status
        data_type: double
        description: Hours the order spent in `from_status`; null for its creation.
