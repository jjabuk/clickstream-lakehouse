version: 2

models:
  - name: fct_page_views
    description: >
      Grain: one page view of a human visitor (`event_id`). Bots and add_to_cart events are
      excluded. Incremental by merge on `event_id`; rows inside the lookback window are
      recomputed on every run because late events can change session membership (ADR 0004).
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [session_id, page_number_in_session]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "received_at >= occurred_at"
    semantic_model:
      enabled: true
    agg_time_dimension: occurred_at
    columns:
      - name: event_id
        data_type: varchar
        description: The event's id from the tracker; one row per page view after deduplication.
        entity:
          type: primary
          name: page_view
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: session_id
        data_type: varchar
        entity:
          type: foreign
          name: session
        description: Hash of the visitor's cookie and the session's first page view time.
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_sessions')
                field: session_id
      - name: session_started_at
        data_type: timestamp with time zone
        description: First page view time of the session this view belongs to.
        data_tests: [not_null]
      - name: page_number_in_session
        data_type: bigint
        description: Position of the view within its session, starting at 1.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: cookie_id
        data_type: varchar
        entity:
          type: foreign
          name: visitor
        description: Browser cookie; never null here, because bots are excluded.
        data_tests: [not_null]
      - name: user_id
        data_type: bigint
        description: Registered user while logged in, otherwise null.
      - name: user_key
        data_type: varchar
        entity:
          type: foreign
          name: user
        description: The user's dimension row valid at `occurred_at`, or the unknown member.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_key
      - name: occurred_at
        data_type: timestamp with time zone
        description: When the page view happened, UTC; the client's time, capped at the server's.
        granularity: hour
        dimension:
          type: time
        data_tests: [not_null]
      - name: date_key
        data_type: integer
        description: UTC date of `occurred_at` as yyyymmdd.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: received_at
        data_type: timestamp with time zone
        description: When the first delivery of the event reached the platform, UTC.
        data_tests: [not_null]
      - name: page_type
        data_type: varchar
        description: home, category, product, cart or checkout.
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: [home, category, product, cart, checkout]
      - name: page_key
        data_type: varchar
        description: The page in dim_page.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_page')
                field: page_key
      - name: page_url
        data_type: varchar
        description: Path of the viewed page.
      - name: product_id
        data_type: bigint
        description: The product of a product page, otherwise null.
      - name: device
        data_type: varchar
        description: mobile or desktop, from the user agent.
        data_tests:
          - accepted_values:
              arguments:
                values: [mobile, desktop]
      - name: country
        data_type: varchar
        description: Country of the visitor from the tracker.
      - name: utm_campaign
        data_type: varchar
        description: Campaign of the session; exists only from the day the tracking was extended.
    metrics:
      - name: page_views
        label: Page views
        description: Human page views.
        type: simple
        agg: count
        expr: 1

  - name: fct_sessions
    description: >
      Grain: one session (`session_id`), a run of one visitor's page views with no gap longer
      than `session_timeout_minutes`. A plain table rebuilt from fct_page_views on every run.
      Device and country come from the entry page view; user and campaign from the first page
      view that has one, so a mid-session login attributes the whole session to the user.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "session_ended_at >= session_started_at"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_bounce = (page_views = 1)"
      # Every page view belongs to exactly one session, so the two facts must agree on volume.
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          arguments:
            expression: sum(page_views)
            compare_model: ref('fct_page_views')
            compare_expression: count(*)
    semantic_model:
      enabled: true
    agg_time_dimension: session_started_at
    columns:
      - name: session_id
        data_type: varchar
        description: Hash of the visitor's cookie and the session's first page view time.
        entity:
          type: primary
          name: session
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: cookie_id
        data_type: varchar
        description: Browser cookie of the visitor.
        entity:
          type: foreign
          name: visitor
        data_tests: [not_null]
      - name: user_id
        data_type: bigint
        description: Registered user of the first identified page view, or null if nobody logged in.
      - name: user_key
        data_type: varchar
        description: The user's dimension version at that page view, or the unknown member.
        entity:
          type: foreign
          name: user
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_key
      - name: session_started_at
        data_type: timestamp with time zone
        description: First page view of the session, UTC.
        granularity: hour
        dimension:
          type: time
        data_tests: [not_null]
      - name: session_ended_at
        data_type: timestamp with time zone
        description: Last page view of the session, UTC.
        data_tests: [not_null]
      - name: date_key
        data_type: integer
        description: UTC date of the session start as yyyymmdd.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: duration_seconds
        data_type: double
        description: >
          Seconds between first and last view. Capped by the session context window the
          incremental fact assumes, so a longer session means that assumption is broken.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: "{{ var('session_context_hours') * 3600 }}"
      - name: page_views
        data_type: bigint
        description: Page views in the session.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: is_bounce
        data_type: boolean
        dimension:
          type: categorical
        description: True for a session with a single page view.
      - name: entry_page_type
        data_type: varchar
        description: Page type of the first page view.
        dimension:
          type: categorical
      - name: exit_page_type
        data_type: varchar
        description: Page type of the last page view.
      - name: product_views
        data_type: bigint
        description: Product page views in the session.
      - name: device
        data_type: varchar
        description: Device of the entry page view.
        dimension:
          type: categorical
      - name: country
        data_type: varchar
        description: Country of the entry page view.
        dimension:
          type: categorical
      - name: utm_campaign
        data_type: varchar
        description: Campaign of the first page view that has one, or null.
        dimension:
          type: categorical
          name: campaign
      - name: last_received_at
        data_type: timestamp with time zone
        description: Latest arrival among the session's page views.
      - name: reached_product
        data_type: boolean
        description: The session viewed a product (first step of the closed funnel).
        data_tests: [not_null]
      - name: reached_cart
        data_type: boolean
        description: The session viewed the cart after a product view.
        data_tests: [not_null]
      - name: reached_checkout
        data_type: boolean
        description: The session viewed the checkout after a cart view that followed a product view.
        data_tests: [not_null]
    metrics:
      - name: sessions
        label: Sessions
        description: Human sessions (bots never reach the marts).
        type: simple
        agg: count
        expr: session_id
      - name: visitors
        label: Visitors
        description: Distinct cookies. Not additive across days or devices.
        type: simple
        agg: count_distinct
        expr: cookie_id
      - name: bounced_sessions
        label: Bounced sessions
        type: simple
        agg: sum_boolean
        expr: is_bounce
      - name: product_sessions
        label: Sessions with a product view
        type: simple
        agg: sum_boolean
        expr: reached_product
      - name: cart_sessions
        label: Sessions that reached the cart
        type: simple
        agg: sum_boolean
        expr: reached_cart
      - name: checkout_sessions
        label: Sessions that reached checkout
        type: simple
        agg: sum_boolean
        expr: reached_checkout
      - name: session_page_views
        label: Page views in sessions
        type: simple
        agg: sum
        expr: page_views
      - name: avg_session_duration_seconds
        label: Average session duration (s)
        type: simple
        agg: average
        expr: duration_seconds

  - name: dim_user
    description: >
      Grain: one version of a registered user (`user_key`), valid from `effective_from` to
      `effective_to`, plus one "unknown" member for anonymous visits. Type 2 history of country
      and plan from the snapshot of the shop's users.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, effective_from]
      # Exactly one current version per user (the unknown member has no user_id).
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id]
          config:
            where: "is_current and user_id is not null"
    semantic_model:
      enabled: true
    columns:
      - name: user_key
        data_type: varchar
        description: Surrogate key of this version (the snapshot's scd id); facts point here.
        entity:
          type: primary
          name: user
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: user_id
        data_type: bigint
        description: The shop's user id; null for the unknown member.
      - name: country
        data_type: varchar
        description: Country of the user in this version.
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: plan
        data_type: varchar
        description: free or premium in this version; unknown for the unknown member.
        dimension:
          type: categorical
        data_tests:
          - accepted_values:
              arguments:
                values: [free, premium, unknown]
      - name: effective_from
        data_type: timestamp with time zone
        description: Start of the version; the first version reaches back to 1900.
        data_tests: [not_null]
      - name: effective_to
        data_type: timestamp with time zone
        description: End of the version, exclusive; 9999-12-31 for the current one.
        data_tests: [not_null]
      - name: is_current
        data_type: boolean
        description: True for the version valid now.

  - name: dim_page
    description: >
      Grain: one page URL of the shop (`page_url`): the home, cart and checkout pages, every
      category page and every product page.
    config:
      contract:
        enforced: true
    columns:
      - name: page_key
        data_type: varchar
        description: Surrogate key of the page URL.
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: page_url
        data_type: varchar
        description: Path of the page.
        data_tests: [unique, not_null]
      - name: page_type
        data_type: varchar
        description: home, category, product, cart or checkout.
        data_tests:
          - accepted_values:
              arguments:
                values: [home, category, product, cart, checkout]
      - name: category_id
        data_type: integer
        description: Category of a category or product page, otherwise null.
      - name: category_slug
        data_type: varchar
        description: URL slug of that category.
      - name: product_id
        data_type: integer
        description: Product of a product page, otherwise null.

  - name: dim_date
    description: "Grain: one calendar day in UTC (`date_key`), from the start of the simulated world."
    config:
      contract:
        enforced: true
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_key
        data_type: integer
        description: The day as yyyymmdd.
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: date_day
        data_type: date
        description: The calendar day; also the semantic layer's daily time spine.
        granularity: day
        data_tests: [unique, not_null]
      - name: calendar_year
        data_type: bigint
        description: Calendar year.
      - name: calendar_month
        data_type: bigint
        description: Month of the year, 1 to 12.
      - name: day_of_month
        data_type: bigint
        description: Day of the month, 1 to 31.
      - name: iso_year
        data_type: bigint
        description: ISO 8601 week-numbering year.
      - name: iso_week
        data_type: bigint
        description: ISO 8601 week number.
      - name: day_of_week
        data_type: bigint
        description: ISO day of week, Monday = 1.
      - name: is_weekend
        data_type: boolean
        description: Saturday or Sunday.
      - name: week_start_date
        data_type: date
        description: Monday of the ISO week.

  - name: fct_funnel_daily
    description: >
      Grain: one day × device × campaign (`funnel_key`). Session counts at each ordered funnel
      step (product view → cart → checkout) and bounced sessions. Only additive counts; rates are
      ratios of sums, computed by the reader.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_key, device, utm_campaign]
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          arguments:
            expression: sum(sessions)
            compare_model: ref('fct_sessions')
            compare_expression: count(*)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "sessions >= product_sessions and product_sessions >= cart_sessions and cart_sessions >= checkout_sessions"
    columns:
      - name: funnel_key
        data_type: varchar
        description: Surrogate key of day, device and campaign.
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: date_key
        data_type: integer
        description: Day of the session start as yyyymmdd.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: device
        data_type: varchar
        description: Device of the sessions.
        data_tests: [not_null]
      - name: utm_campaign
        data_type: varchar
        description: Campaign, or `(none)` for sessions without one.
        data_tests: [not_null]
      - name: sessions
        data_type: bigint
        description: Human sessions.
      - name: bounced_sessions
        data_type: bigint
        description: Sessions with a single page view; bounce rate = bounced_sessions / sessions.
      - name: product_sessions
        data_type: bigint
        description: Sessions that viewed a product (first funnel step).
      - name: cart_sessions
        data_type: bigint
        description: Sessions that reached the cart after a product view.
      - name: checkout_sessions
        data_type: bigint
        description: Sessions that reached the checkout after a cart view that followed a product view.

  - name: fct_retention_weekly
    description: >
      Grain: one cohort week × activity week (`retention_key`). A visitor (cookie) belongs to the
      ISO week of their first human page view. `cohort_visitors` repeats the cohort's size on
      every row, so it must not be summed across activity weeks.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "active_visitors <= cohort_visitors and activity_week >= cohort_week"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "weeks_since_first_visit > 0 or active_visitors = cohort_visitors"
    columns:
      - name: retention_key
        data_type: varchar
        description: Surrogate key of cohort week and activity week.
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: cohort_week
        data_type: date
        description: Monday of the visitor's first week.
        data_tests: [not_null]
      - name: activity_week
        data_type: date
        description: Monday of the week the visitors were active in.
        data_tests: [not_null]
      - name: weeks_since_first_visit
        data_type: integer
        description: Whole weeks between the cohort week and the activity week.
      - name: cohort_visitors
        data_type: bigint
        description: Visitors in the cohort; repeated on every row of the cohort.
      - name: active_visitors
        data_type: bigint
        description: Cohort visitors with a page view in the activity week.

  - name: fct_traffic_daily
    description: >
      Grain: one day × traffic type (`traffic_key`, `is_bot`). Deduplicated events of humans and
      bots, to show what bot filtering removes from the other marts.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_key, is_bot]
    semantic_model:
      enabled: true
    agg_time_dimension: date_day
    columns:
      - name: traffic_key
        data_type: varchar
        description: Surrogate key of day and traffic type.
        entity:
          type: primary
          name: traffic_day
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: date_key
        data_type: integer
        description: Day of the events as yyyymmdd.
        data_tests: [not_null]
      - name: date_day
        data_type: date
        description: UTC date of the event, the same day as `date_key`.
        granularity: day
        dimension:
          type: time
        data_tests: [not_null]
      - name: is_bot
        data_type: boolean
        description: True for bot traffic (no cookie or a bot user agent).
        dimension:
          type: categorical
        data_tests: [not_null]
      - name: events
        data_type: bigint
        description: Deduplicated events of all types.
      - name: page_view_events
        data_type: bigint
        description: Deduplicated page views.
      - name: add_to_cart_events
        data_type: bigint
        description: Deduplicated add-to-cart events.
    metrics:
      - name: events
        label: Events
        description: Deduplicated events of humans and bots.
        type: simple
        agg: sum
        expr: events
      - name: bot_events
        label: Bot events
        type: simple
        agg: sum
        expr: events
        filter: "{{ Dimension('traffic_day__is_bot') }}"

  - name: fct_visitor_conversion_daily
    description: >
      Grain: one visitor (cookie) × day with a product view (`visitor_day_key`). Whether the
      visitor reached a checkout page within 7 days after their first product view of that day,
      in the same session or a later one. Rows whose 7-day window is still open
      (`is_window_complete` false) can still convert and belong out of rates.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cookie_id, product_day]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "converted_at is null or converted_at > product_viewed_at"
    semantic_model:
      enabled: true
    agg_time_dimension: product_viewed_at
    columns:
      - name: visitor_day_key
        data_type: varchar
        description: Surrogate key of cookie and day.
        entity:
          type: primary
          name: visitor_day
        constraints: [{type: not_null}]
        data_tests: [unique, not_null]
      - name: cookie_id
        data_type: varchar
        description: Browser cookie of the visitor.
        entity:
          type: foreign
          name: visitor
        data_tests: [not_null]
      - name: date_key
        data_type: integer
        description: The product view day as yyyymmdd.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: product_day
        data_type: date
        description: UTC day of the product views.
        data_tests: [not_null]
      - name: product_viewed_at
        data_type: timestamp with time zone
        description: The visitor's first product view of the day; the 7-day window starts here.
        granularity: hour
        dimension:
          type: time
        data_tests: [not_null]
      - name: device
        data_type: varchar
        description: Device of that first product view.
        dimension:
          type: categorical
      - name: converted_at
        data_type: timestamp with time zone
        description: First checkout page view inside the window, or null.
      - name: is_converted_7d
        data_type: boolean
        description: A checkout followed within 7 days.
        data_tests: [not_null]
      - name: is_window_complete
        data_type: boolean
        description: >
          The 7 days after the product view are all in the data, so the row cannot change any
          more. False for the last week of data.
        dimension:
          type: categorical
        data_tests: [not_null]
    metrics:
      - name: product_viewer_days
        label: Visitors with a product view (visitor-days)
        description: One per visitor and day with a product view.
        type: simple
        agg: count
        expr: 1
      - name: converted_viewer_days
        label: Of those, reached checkout within 7 days
        type: simple
        agg: sum_boolean
        expr: is_converted_7d
