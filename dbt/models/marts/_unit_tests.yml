version: 2

unit_tests:
  # ---- sessionization ------------------------------------------------------------------------
  - name: fct_page_views__session_gap_is_30_minutes
    description: A 29-minute gap keeps the session, a 31-minute gap starts a new one.
    model: fct_page_views
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_clickstream__events')
        rows:
          - {event_id: e1, event_type: page_view, cookie_id: c1, is_bot: false, page_type: home, page_url: /, occurred_at: '2026-03-01 10:00:00+00', received_at: '2026-03-01 10:00:01+00'}
          - {event_id: e2, event_type: page_view, cookie_id: c1, is_bot: false, page_type: product, page_url: /p/1, occurred_at: '2026-03-01 10:29:00+00', received_at: '2026-03-01 10:29:01+00'}
          - {event_id: e3, event_type: page_view, cookie_id: c1, is_bot: false, page_type: cart, page_url: /cart, occurred_at: '2026-03-01 11:00:00+00', received_at: '2026-03-01 11:00:01+00'}
          - {event_id: e4, event_type: page_view, cookie_id: c2, is_bot: false, page_type: home, page_url: /, occurred_at: '2026-03-01 10:05:00+00', received_at: '2026-03-01 10:05:01+00'}
      - input: ref('dim_user')
        rows:
          - {user_key: unknown, user_id: null, effective_from: '1900-01-01 00:00:00+00', effective_to: '9999-12-31 00:00:00+00'}
    expect:
      rows:
        - {event_id: e1, session_started_at: '2026-03-01 10:00:00+00', page_number_in_session: 1}
        - {event_id: e2, session_started_at: '2026-03-01 10:00:00+00', page_number_in_session: 2}
        - {event_id: e3, session_started_at: '2026-03-01 11:00:00+00', page_number_in_session: 1}
        - {event_id: e4, session_started_at: '2026-03-01 10:05:00+00', page_number_in_session: 1}

  - name: fct_page_views__only_human_page_views
    description: Bots and add_to_cart events never reach the fact.
    model: fct_page_views
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_clickstream__events')
        rows:
          - {event_id: human_view, event_type: page_view, cookie_id: c1, is_bot: false, page_type: home, page_url: /, occurred_at: '2026-03-01 10:00:00+00', received_at: '2026-03-01 10:00:01+00'}
          - {event_id: cart_add, event_type: add_to_cart, cookie_id: c1, is_bot: false, page_type: product, page_url: /p/1, occurred_at: '2026-03-01 10:00:05+00', received_at: '2026-03-01 10:00:06+00'}
          - {event_id: bot_view, event_type: page_view, cookie_id: null, is_bot: true, page_type: product, page_url: /p/1, occurred_at: '2026-03-01 10:00:00+00', received_at: '2026-03-01 10:00:01+00'}
      - input: ref('dim_user')
        rows:
          - {user_key: unknown, user_id: null, effective_from: '1900-01-01 00:00:00+00', effective_to: '9999-12-31 00:00:00+00'}
    expect:
      rows:
        - {event_id: human_view}

  # ---- slowly changing user attributes ---------------------------------------------------------
  - name: fct_page_views__user_key_is_the_version_valid_at_the_event
    description: >
      The same user gets different dimension rows before and after an attribute change, and an
      anonymous view gets the unknown member.
    model: fct_page_views
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_clickstream__events')
        rows:
          - {event_id: before, event_type: page_view, cookie_id: c1, user_id: 1, is_bot: false, page_type: home, page_url: /, occurred_at: '2026-03-01 23:50:00+00', received_at: '2026-03-01 23:50:01+00'}
          - {event_id: after, event_type: page_view, cookie_id: c1, user_id: 1, is_bot: false, page_type: home, page_url: /, occurred_at: '2026-03-02 00:10:00+00', received_at: '2026-03-02 00:10:01+00'}
          - {event_id: anonymous, event_type: page_view, cookie_id: c2, user_id: null, is_bot: false, page_type: home, page_url: /, occurred_at: '2026-03-02 00:10:00+00', received_at: '2026-03-02 00:10:01+00'}
      - input: ref('dim_user')
        rows:
          - {user_key: k_old, user_id: 1, effective_from: '1900-01-01 00:00:00+00', effective_to: '2026-03-02 00:00:00+00'}
          - {user_key: k_new, user_id: 1, effective_from: '2026-03-02 00:00:00+00', effective_to: '9999-12-31 00:00:00+00'}
    expect:
      rows:
        - {event_id: before, user_key: k_old}
        - {event_id: after, user_key: k_new}
        - {event_id: anonymous, user_key: ab623e1f8d51d01aeef17b147ac104c1}

  # ---- late events (incremental run) -----------------------------------------------------------
  - name: fct_page_views__late_event_bridges_two_sessions
    description: >
      A and B are 40 minutes apart, so they were two sessions. A late event at 10:20 arrives days
      later and joins them: B is reprocessed and moves into A's session.
    model: fct_page_views
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('stg_clickstream__events')
        rows:
          - {event_id: a, event_type: page_view, cookie_id: c1, is_bot: false, page_type: home, page_url: /, occurred_at: '2026-03-01 10:00:00+00', received_at: '2026-03-01 10:00:01+00'}
          - {event_id: b, event_type: page_view, cookie_id: c1, is_bot: false, page_type: product, page_url: /p/1, occurred_at: '2026-03-01 10:40:00+00', received_at: '2026-03-01 10:40:01+00'}
          - {event_id: late, event_type: page_view, cookie_id: c1, is_bot: false, page_type: category, page_url: /c/1, occurred_at: '2026-03-01 10:20:00+00', received_at: '2026-03-02 09:00:00+00'}
      - input: ref('dim_user')
        rows:
          - {user_key: unknown, user_id: null, effective_from: '1900-01-01 00:00:00+00', effective_to: '9999-12-31 00:00:00+00'}
      - input: this
        rows:
          - {event_id: a, cookie_id: c1, occurred_at: '2026-03-01 10:00:00+00', received_at: '2026-03-01 10:00:01+00'}
          - {event_id: b, cookie_id: c1, occurred_at: '2026-03-01 10:40:00+00', received_at: '2026-03-01 10:40:01+00'}
    expect:
      rows:
        - {event_id: a, session_started_at: '2026-03-01 10:00:00+00', page_number_in_session: 1}
        - {event_id: late, session_started_at: '2026-03-01 10:00:00+00', page_number_in_session: 2}
        - {event_id: b, session_started_at: '2026-03-01 10:00:00+00', page_number_in_session: 3}

  - name: fct_page_views__new_event_continues_a_session_from_before_the_window
    description: >
      The window starts 48 h before the newest arrival (2026-02-27 11:00). The last view of the
      visitor is older than that and is only read as context, not rewritten; the new view 20
      minutes later continues its session and inherits the start.
    model: fct_page_views
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('stg_clickstream__events')
        rows:
          - {event_id: old, event_type: page_view, cookie_id: c1, is_bot: false, page_type: home, page_url: /, occurred_at: '2026-02-27 10:50:00+00', received_at: '2026-02-27 10:50:01+00'}
          - {event_id: fresh, event_type: page_view, cookie_id: c1, is_bot: false, page_type: product, page_url: /p/1, occurred_at: '2026-02-27 11:10:00+00', received_at: '2026-03-01 11:10:00+00'}
      - input: ref('dim_user')
        rows:
          - {user_key: unknown, user_id: null, effective_from: '1900-01-01 00:00:00+00', effective_to: '9999-12-31 00:00:00+00'}
      - input: this
        rows:
          - {event_id: old, cookie_id: c1, occurred_at: '2026-02-27 10:50:00+00', received_at: '2026-02-27 10:50:01+00'}
          - {event_id: newest, cookie_id: c9, occurred_at: '2026-03-01 11:00:00+00', received_at: '2026-03-01 11:00:00+00'}
    expect:
      rows:
        - {event_id: fresh, session_started_at: '2026-02-27 10:50:00+00', page_number_in_session: 2}

  # ---- session aggregation ---------------------------------------------------------------------
  - name: fct_sessions__aggregates_a_session
    model: fct_sessions
    versions: {include: [2]}  # v1 renames a column of v2
    given:
      - input: ref('fct_page_views')
        rows:
          - {session_id: s1, cookie_id: c1, user_id: 5, user_key: k5, page_number_in_session: 1, occurred_at: '2026-03-01 10:00:00+00', received_at: '2026-03-01 10:00:01+00', page_type: home, device: mobile, country: PL, utm_campaign: null}
          - {session_id: s1, cookie_id: c1, user_id: 5, user_key: k5, page_number_in_session: 2, occurred_at: '2026-03-01 10:01:00+00', received_at: '2026-03-01 10:01:01+00', page_type: product, device: mobile, country: PL, utm_campaign: spring_sale}
          - {session_id: s1, cookie_id: c1, user_id: 5, user_key: k5, page_number_in_session: 3, occurred_at: '2026-03-01 10:03:00+00', received_at: '2026-03-01 10:03:01+00', page_type: cart, device: mobile, country: PL, utm_campaign: spring_sale}
          - {session_id: s2, cookie_id: c2, user_id: null, user_key: unknown, page_number_in_session: 1, occurred_at: '2026-03-01 12:00:00+00', received_at: '2026-03-01 12:00:01+00', page_type: home, device: desktop, country: DE, utm_campaign: null}
      # The closed funnel comes from its own model, tested in _intermediate.yml.
      - input: ref('int_sessions__funnel_steps')
        rows:
          - {session_id: s1, reached_product: true, reached_cart: true, reached_checkout: false}
          - {session_id: s2, reached_product: false, reached_cart: false, reached_checkout: false}
      - input: ref('int_identity__cookie_to_user')
        rows: []
    expect:
      rows:
        - {session_id: s1, page_views: 3, is_bounce: false, entry_page_type: home, exit_page_type: cart, product_views: 1, reached_cart: true, reached_checkout: false, duration_seconds: 180, user_id: 5, campaign: spring_sale}
        - {session_id: s2, page_views: 1, is_bounce: true, entry_page_type: home, exit_page_type: home, product_views: 0, reached_cart: false, reached_checkout: false, duration_seconds: 0, user_id: null, campaign: null}

  - name: fct_sessions__attributes_are_deterministic
    description: >
      Attributes that vary inside a session are not picked arbitrarily: device and country come
      from the entry page view, and a visitor who logs in mid-session is attributed for the whole
      session (user_id and user_key of the first identified page view).
    model: fct_sessions
    versions: {include: [2]}  # v1 renames a column of v2
    given:
      - input: ref('fct_page_views')
        rows:
          - {session_id: s3, cookie_id: c3, user_id: null, user_key: unknown, page_number_in_session: 1, occurred_at: '2026-03-01 09:00:00+00', page_type: home, device: desktop, country: PL}
          - {session_id: s3, cookie_id: c3, user_id: 7, user_key: k7_v1, page_number_in_session: 2, occurred_at: '2026-03-01 09:05:00+00', page_type: product, device: mobile, country: DE}
          - {session_id: s3, cookie_id: c3, user_id: 7, user_key: k7_v2, page_number_in_session: 3, occurred_at: '2026-03-01 09:06:00+00', page_type: cart, device: mobile, country: DE}
      - input: ref('int_sessions__funnel_steps')
        rows:
          - {session_id: s3, reached_product: true, reached_cart: true, reached_checkout: false}
      - input: ref('int_identity__cookie_to_user')
        rows: []
    expect:
      rows:
        - {session_id: s3, user_id: 7, user_key: k7_v1, device: desktop, country: PL}

  - name: fct_sessions__identity_from_the_login_or_the_cookie
    description: >
      Identity stitching (ADR 0022). s1 logged in; s2 on the same cookie did not and is stitched
      to its user; s3 is on a shared computer and stays unknown, s4 on a cookie nobody logged in
      on. The person is the user when known, otherwise the cookie.
    model: fct_sessions
    versions: {include: [2]}  # v1 has no identity columns
    given:
      - input: ref('fct_page_views')
        rows:
          - {session_id: s1, cookie_id: laptop, user_id: 7, user_key: k7, page_number_in_session: 1, occurred_at: '2026-03-02 10:00:00+00', page_type: home}
          - {session_id: s2, cookie_id: laptop, user_id: null, user_key: unknown, page_number_in_session: 1, occurred_at: '2026-03-01 10:00:00+00', page_type: home}
          - {session_id: s3, cookie_id: family_pc, user_id: null, user_key: unknown, page_number_in_session: 1, occurred_at: '2026-03-01 11:00:00+00', page_type: home}
          - {session_id: s4, cookie_id: stranger, user_id: null, user_key: unknown, page_number_in_session: 1, occurred_at: '2026-03-01 12:00:00+00', page_type: home}
      - input: ref('int_sessions__funnel_steps')
        rows:
          - {session_id: s1, reached_product: false, reached_cart: false, reached_checkout: false}
          - {session_id: s2, reached_product: false, reached_cart: false, reached_checkout: false}
          - {session_id: s3, reached_product: false, reached_cart: false, reached_checkout: false}
          - {session_id: s4, reached_product: false, reached_cart: false, reached_checkout: false}
      - input: ref('int_identity__cookie_to_user')
        rows:
          - {cookie_id: laptop, user_id: 7, is_shared_device: false}
          - {cookie_id: family_pc, user_id: null, is_shared_device: true}
    expect:
      rows:
        - {session_id: s1, user_id: 7, identified_user_id: 7, identity_source: login, person_id: 'user:7'}
        - {session_id: s2, user_id: null, identified_user_id: 7, identity_source: stitched, person_id: 'user:7'}
        - {session_id: s3, user_id: null, identified_user_id: null, identity_source: shared_device, person_id: 'cookie:family_pc'}
        - {session_id: s4, user_id: null, identified_user_id: null, identity_source: anonymous, person_id: 'cookie:stranger'}

  # ---- dim_user ---------------------------------------------------------------------------------
  - name: dim_user__versions_and_unknown_member
    description: >
      The first observed version reaches back to 1900, later versions start at their own time,
      and the open version ends in year 9999. One unknown member is added.
    model: dim_user
    given:
      - input: ref('snap_users')
        rows:
          - {dbt_scd_id: v1, user_id: 1, country: PL, plan: free, dbt_valid_from: '2026-01-05 00:00:00+00', dbt_valid_to: '2026-02-10 00:00:00+00'}
          - {dbt_scd_id: v2, user_id: 1, country: DE, plan: free, dbt_valid_from: '2026-02-10 00:00:00+00', dbt_valid_to: null}
          - {dbt_scd_id: v3, user_id: 2, country: FR, plan: premium, dbt_valid_from: '2026-01-07 00:00:00+00', dbt_valid_to: null}
    expect:
      rows:
        - {user_key: v1, user_id: 1, country: PL, plan: free, effective_from: '1900-01-01 00:00:00+00', effective_to: '2026-02-10 00:00:00+00', is_current: false}
        - {user_key: v2, user_id: 1, country: DE, plan: free, effective_from: '2026-02-10 00:00:00+00', effective_to: '9999-12-31 00:00:00+00', is_current: true}
        - {user_key: v3, user_id: 2, country: FR, plan: premium, effective_from: '1900-01-01 00:00:00+00', effective_to: '9999-12-31 00:00:00+00', is_current: true}
        - {user_key: ab623e1f8d51d01aeef17b147ac104c1, user_id: null, country: unknown, plan: unknown, effective_from: '1900-01-01 00:00:00+00', effective_to: '9999-12-31 00:00:00+00', is_current: true}

  # ---- visitor conversion -----------------------------------------------------------------------
  - name: fct_visitor_conversion_daily__window_and_censoring
    description: >
      c1 views a product and checks out 3 days later in another session: converted. c2 checks out
      before the product view and again 8 days after it: neither is inside the window. c3 views a
      product 2 days before the end of the data: not converted yet, and its window is still open.
    model: fct_visitor_conversion_daily
    given:
      - input: ref('fct_page_views')
        rows:
          - {cookie_id: c1, page_type: product, device: mobile, occurred_at: '2026-02-01 10:00:00+00'}
          - {cookie_id: c1, page_type: product, device: desktop, occurred_at: '2026-02-01 18:00:00+00'}
          - {cookie_id: c1, page_type: checkout, device: desktop, occurred_at: '2026-02-04 09:00:00+00'}
          - {cookie_id: c2, page_type: checkout, device: mobile, occurred_at: '2026-02-01 09:00:00+00'}
          - {cookie_id: c2, page_type: product, device: mobile, occurred_at: '2026-02-01 12:00:00+00'}
          - {cookie_id: c2, page_type: checkout, device: mobile, occurred_at: '2026-02-09 12:00:01+00'}
          - {cookie_id: c3, page_type: product, device: desktop, occurred_at: '2026-02-08 12:00:00+00'}
          - {cookie_id: c9, page_type: home, device: desktop, occurred_at: '2026-02-10 12:00:00+00'}
    expect:
      rows:
        - {cookie_id: c1, product_day: '2026-02-01', device: mobile, is_converted_7d: true, converted_at: '2026-02-04 09:00:00+00', is_window_complete: true}
        - {cookie_id: c2, product_day: '2026-02-01', device: mobile, is_converted_7d: false, converted_at: null, is_window_complete: true}
        - {cookie_id: c3, product_day: '2026-02-08', device: desktop, is_converted_7d: false, converted_at: null, is_window_complete: false}

  # ---- product views -------------------------------------------------------------------------
  - name: fct_product_views_daily__counts_per_product_and_day
    description: >
      Only product pages count as views; bots' adds to cart do not count; a product with an add
      to cart but no view still gets a row; a view at 23:30 UTC belongs to its UTC day.
    model: fct_product_views_daily
    given:
      - input: ref('fct_page_views')
        rows:
          - {page_type: product, product_id: 1, session_id: s1, cookie_id: c1, occurred_at: '2026-03-01 10:00:00+00'}
          - {page_type: product, product_id: 1, session_id: s1, cookie_id: c1, occurred_at: '2026-03-01 10:05:00+00'}
          - {page_type: product, product_id: 1, session_id: s2, cookie_id: c2, occurred_at: '2026-03-01 23:30:00+00'}
          - {page_type: home, product_id: null, session_id: s1, cookie_id: c1, occurred_at: '2026-03-01 09:59:00+00'}
      - input: ref('stg_clickstream__events')
        rows:
          - {event_type: add_to_cart, is_bot: false, product_id: 1, cookie_id: c1, occurred_at: '2026-03-01 10:06:00+00'}
          - {event_type: add_to_cart, is_bot: true, product_id: 1, cookie_id: null, occurred_at: '2026-03-01 10:07:00+00'}
          - {event_type: add_to_cart, is_bot: false, product_id: 2, cookie_id: c3, occurred_at: '2026-03-02 08:00:00+00'}
          - {event_type: page_view, is_bot: false, product_id: 1, cookie_id: c1, occurred_at: '2026-03-01 10:00:00+00'}
      - input: ref('stg_shop__products')
        rows:
          - {product_id: 1, category_id: 10}
          - {product_id: 2, category_id: 20}
    expect:
      rows:
        - {date_key: 20260301, product_id: 1, category_id: 10, page_views: 3, sessions: 2, visitors: 2, add_to_carts: 1}
        - {date_key: 20260302, product_id: 2, category_id: 20, page_views: 0, sessions: 0, visitors: 0, add_to_carts: 1}

  - name: fct_orders__milestones_and_history_from_the_snapshot
    description: >
      An order captured from its insert gets every milestone and a complete history. An order
      that entered the log through the snapshot keeps its current status and the milestones
      from then on; the earlier ones are unknown, and its flags still come from the status.
    model: fct_orders
    given:
      - input: ref('stg_shop_cdc__order_changes')
        rows:
          - {order_id: 1, change_type: insert, status: created, user_id: 7, cookie_id: c1, total_cents: 2500, created_at: '2026-03-01 10:00:00+00', changed_at: '2026-03-01 10:00:00+00', lsn: 10, log_position: 10}
          - {order_id: 1, change_type: update, status: paid, user_id: 7, cookie_id: c1, total_cents: 2500, created_at: '2026-03-01 10:00:00+00', changed_at: '2026-03-01 10:30:00+00', lsn: 11, log_position: 11}
          - {order_id: 1, change_type: update, status: shipped, user_id: 7, cookie_id: c1, total_cents: 2500, created_at: '2026-03-01 10:00:00+00', changed_at: '2026-03-02 10:30:00+00', lsn: 12, log_position: 12}
          - {order_id: 2, change_type: snapshot, status: shipped, user_id: null, cookie_id: c2, total_cents: 1000, created_at: '2026-02-20 09:00:00+00', changed_at: '2026-02-22 09:00:00+00', lsn: 1, log_position: 1}
          - {order_id: 2, change_type: update, status: delivered, user_id: null, cookie_id: c2, total_cents: 1000, created_at: '2026-02-20 09:00:00+00', changed_at: '2026-03-01 09:00:00+00', lsn: 13, log_position: 13}
      - input: ref('stg_shop_cdc__order_items')
        rows:
          - {order_id: 1, line_no: 1, quantity: 2, line_total_cents: 2500}
          - {order_id: 2, line_no: 1, quantity: 1, line_total_cents: 1000}
      - input: ref('dim_user')
        rows:
          - {user_key: u7, user_id: 7, effective_from: '1900-01-01 00:00:00+00', effective_to: '9999-12-31 00:00:00+00'}
    expect:
      rows:
