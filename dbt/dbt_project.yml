name: clickstream
version: "0.1.0"
config-version: 2
profile: clickstream

model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Incremental models reprocess this many hours back, so late events (up to 48 h, ADR 0004)
  # still reach the facts they belong to.
  lookback_hours: 48
  # A new session starts after a gap longer than this between two page views of a visitor.
  session_timeout_minutes: 30
  # Sessions are assumed to be shorter than this, so this much history before the reprocessing
  # window is enough context to sessionize the window (a data test guards the assumption).
  session_context_hours: 12
  # Range of dim_date; the world starts at the generator's epoch (2026-01-01).
  dim_date_start: "2026-01-01"
  dim_date_end: "2028-01-01"
  # dbt_project_evaluator audits the project itself. It is off in a normal build (it would add
  # ~48 models to the warehouse) and switched on by `make dbt-evaluate`.
  enable_project_evaluator: false # read with a default in the config below; also set by the make target
  # The evaluator audits this project's conventions, not those of installed packages.
  exclude_packages: ["elementary"]
  # elementary's anomaly tests train on the days before "now" and test the last ones. Time in the
  # data is simulated, so "now" is the simulated clock: the end of the latest arrival day loaded
  # (written by `make day`, passed by make as SIMULATED_NOW). Empty means the wall clock.
  custom_run_started_at: "{{ env_var('SIMULATED_NOW', '') }}"

models:
  clickstream:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      # Marts are the project's interface: the semantic layer, the dashboard and later Feast read
      # them (exposures in models/marts/_exposures.yml).
      +access: public

  elementary:
    # Test results and run artifacts that `edr report` reads, kept apart from the marts.
    +schema: elementary

  dbt_project_evaluator:
    +enabled: "{{ var('enable_project_evaluator', false) | as_bool }}"
    # Keep the ~50 audit tables out of the schema that holds the marts.
    +schema: evaluator

seeds:
  dbt_project_evaluator:
    +enabled: "{{ var('enable_project_evaluator', false) | as_bool }}"
    +schema: evaluator
    # Replaced by this project's seed of the same name, which holds the documented exceptions.
    dbt_project_evaluator_exceptions:
      +enabled: false
  clickstream:
    # Documented exceptions for the evaluator; only used when it runs.
    dbt_project_evaluator_exceptions:
      +enabled: "{{ var('enable_project_evaluator', false) | as_bool }}"
      +schema: evaluator
