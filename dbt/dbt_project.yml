name: clickstream
version: "0.1.0"
config-version: 2
profile: clickstream

model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Incremental models reprocess this many hours back, so late events (up to 48 h, ADR 0004)
  # still reach the facts they belong to.
  lookback_hours: 48
  # A new session starts after a gap longer than this between two page views of a visitor.
  session_timeout_minutes: 30
  # Sessions are assumed to be shorter than this, so this much history before the reprocessing
  # window is enough context to sessionize the window (a data test guards the assumption).
  session_context_hours: 12
  # Range of dim_date; the world starts at the generator's epoch (2026-01-01).
  dim_date_start: "2026-01-01"
  dim_date_end: "2028-01-01"
  # dbt_project_evaluator's rules are dbt checks (ADR 0024): they run on the project graph before
  # every build, and alone with `make dbt-evaluate`. These are the accepted violations, each with
  # its reason.
  dbt_project_evaluator_exceptions:
    fct_root_models:
      - dim_date # a generated calendar, so it has no upstream model
    fct_sources_without_freshness:
      # Time in the data is simulated, so source freshness against the wall clock means nothing.
      - clickstream.events
      - shop.users
      - shop.products
      - shop.categories
    fct_rejoining_of_upstream_concepts:
      # The closed funnel is its own model so that its ordering rule has a unit test, and
      # fct_sessions joins it back to the page views on purpose.
      - int_sessions__funnel_steps

models:
  clickstream:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
      # Marts are the project's interface: the semantic layer, the dashboard and later Feast read
      # them (exposures in models/marts/_exposures.yml).
      +access: public

# A violation of the project's conventions fails the build, as the 1.x evaluator failed `make check`.
checks:
  dbt_project_evaluator:
    +severity: error

flags:
  # dbt v2 (ADR 0024): the Iceberg REST catalog is declared in catalogs.yml, not as a DuckDB
  # attach in profiles.yml, which v2 does not pass through.
  use_catalogs_v2: true
  # Generic test arguments are read from `arguments:` only (dbt-autofix).
  require_generic_test_arguments_property: true
