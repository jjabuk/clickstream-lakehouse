[project]
name = "clickstream-lakehouse"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka[avro,schemaregistry]==2.16.2",
    # dbt v2 (ADR 0024): one binary with the DuckDB adapter built in.
    "dbt==2.0.12",
    "duckdb==2.0.0",
    "numpy==2.5.5",
    "psycopg[binary]==3.3.9",
    "pyarrow==26.0.1",
    "pyiceberg[pyarrow,s3fs,pyiceberg-core]==0.12.0",
    # DuckDB needs it to return timestamps with a time zone to Python; dbt-core used to bring it.
    "pytz==2026.6",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pyyaml==6.0.3",
    "ruff==0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs the local stack running (make bootstrap)",
    "stream: needs the stream profile on the stack (make stream-up)",
]
